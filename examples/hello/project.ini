[project]
name       = hello
title      = Hello PocketStation    ; PS1 memory card screen title (max 31 chars)
filename   = BISCPS-P0001HELLO      ; card file name, keep the "P" at position 7
icon       = icon1.txt, icon2.txt   ; 32x32 mono frames (text art or PNG)
icon_delay = 15                     ; 1/30 s per frame
psx_icon   = auto                   ; or a 16x16 PNG with up to 16 colours
sources    = src/*.c
cflags     = -O2
debug      = 1                      ; ps_log() output (shown by pocketsim)
